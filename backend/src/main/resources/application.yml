server:
  port: 8080

spring:
  application:
    name: setting-module
  datasource:
    url: jdbc:mysql://localhost:3306/settingdb?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Taipei&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: create
    generate-ddl: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Setting Module 自訂配置
setting:
  init:
    enabled: true            # 是否在啟動時自動初始化預設種子資料 (生產環境可依需要開關)
    default-tenant: ALL      # 預設初始化的租戶代碼 (預設 ALL)

# SpringDoc OpenAPI 配置
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true

logging:
  charset:
    console: UTF-8
    file: UTF-8
  level:
    root: INFO
    com.module.setting: DEBUG
    org.hibernate.SQL: DEBUG
