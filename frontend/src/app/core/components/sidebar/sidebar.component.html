<aside
  class="enterprise-sidebar"
  [class.collapsed]="collapsed"
  [class.mobile-open]="mobileOpen"
>
  <!-- 品牌標識區 -->
  <div class="sidebar-brand">
    <div class="brand-identity">
      <div class="brand-logo">
        <i class="pi pi-cog"></i>
      </div>
      <div class="brand-text" *ngIf="!collapsed">
        <span class="brand-title">Enterprise Admin</span>
        <span class="brand-sub">通用模組控制台</span>
      </div>
    </div>
    <!-- 手機版關閉按鈕 -->
    <button
      class="mobile-close-btn"
      (click)="closeMobile.emit()"
      aria-label="關閉選單"
    >
      <i class="pi pi-times"></i>
    </button>
  </div>

  <!-- 拖拉排序控制條 -->
  <div class="sidebar-sort-bar">
    <button
      class="sort-toggle-btn"
      [class.active]="isReorderMode"
      (click)="toggleReorderMode()"
      [pTooltip]="collapsed ? (isReorderMode ? '完成選單排序' : '切換拖拉排序') : ''"
      tooltipPosition="right"
    >
      <i [class]="isReorderMode ? 'pi pi-check' : 'pi pi-sort-alt'"></i>
      <span class="sort-label" *ngIf="!collapsed">
        {{ isReorderMode ? '完成選單排序' : '切換拖拉排序' }}
      </span>
      <span class="reorder-badge" *ngIf="isReorderMode && !collapsed">拖曳中</span>
    </button>
  </div>

  <!-- 導航功能選單 -->
  <div class="sidebar-menu">
    <div class="menu-group" *ngFor="let group of menuGroups">
      <div class="group-title" *ngIf="!collapsed">
        <span>{{ group.group }}</span>
        <span class="group-reorder-hint" *ngIf="isReorderMode">拖曳項目調整順序</span>
      </div>
      <ul class="nav-list">
        <li
          *ngFor="let item of group.items"
          class="nav-item"
          [class.active]="item.active && !isReorderMode"
          [class.reorder-mode]="isReorderMode"
          [class.is-dragging]="draggedItem === item"
          [class.drag-over]="dragOverItem === item"
          [draggable]="isReorderMode"
          (dragstart)="onDragStart(group, item, $event)"
          (dragover)="onDragOver($event)"
          (dragenter)="onDragEnter(item)"
          (dragleave)="onDragLeave(item)"
          (drop)="onDrop(group, item, $event)"
          (dragend)="onDragEnd()"
          (click)="onMenuClick(item)"
          [pTooltip]="collapsed ? item.label : (isReorderMode ? '按住並拖曳可調整順序' : '')"
          tooltipPosition="right"
        >
          <!-- 拖曳握把圖示 (排序模式下顯示) -->
          <i class="pi pi-bars drag-handle" *ngIf="isReorderMode && !collapsed"></i>

          <i [class]="item.icon + ' nav-icon'"></i>
          <span class="nav-label" *ngIf="!collapsed">{{ item.label }}</span>
          <span class="nav-badge" *ngIf="!collapsed && item.badge">{{ item.badge }}</span>
        </li>
      </ul>
    </div>
  </div>

  <!-- 底部縮合切換按鈕 -->
  <div class="sidebar-footer">
    <button class="collapse-btn" (click)="toggleCollapse.emit()">
      <i [class]="collapsed ? 'pi pi-angle-double-right' : 'pi pi-angle-double-left'"></i>
      <span *ngIf="!collapsed">收合側邊欄</span>
    </button>
  </div>
</aside>
